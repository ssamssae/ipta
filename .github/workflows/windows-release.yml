name: Windows release build
on:
  pull_request:
    paths: ["windows/**", "Native/**", ".github/workflows/windows-release.yml"]
  workflow_dispatch:
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build bundled transcription engine
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp.git "$env:RUNNER_TEMP/whisper"
          cmake -S Native -DWHISPER_SOURCE_DIR="$env:RUNNER_TEMP/whisper" -B "$env:RUNNER_TEMP/whisper-build" -A x64 -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=ON -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          if ($LASTEXITCODE -ne 0) { throw "Configure failed" }
          cmake --build "$env:RUNNER_TEMP/whisper-build" --config Release --target whisper-cli ipta-transcriber --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Whisper build failed" }
          New-Item -ItemType Directory -Force windows/Helpers | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP/whisper-build" -Recurse -File | Where-Object { $_.Name -in @("whisper-cli.exe", "ipta-transcriber.exe") -or $_.Extension -eq ".dll" } | Copy-Item -Destination windows/Helpers
          foreach ($Dll in @("ggml-cpu-x64.dll", "ggml-cpu-haswell.dll", "ggml-cpu-alderlake.dll")) {
            if (!(Test-Path "windows/Helpers/$Dll")) { throw "Missing CPU backend: $Dll" }
          }
      - name: Transcription fixture
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin" -OutFile "$env:RUNNER_TEMP/whisper/models/ggml-tiny.en.bin"
      - name: Logic regression tests
        shell: bash
        run: bash windows/scripts/test_windows.sh
      - name: Test and package
        shell: pwsh
        run: |
          python -m pip install -r windows/requirements-windows.txt
          python -m unittest discover -s windows/tests -p "test_provider_workspace.py"
          if ($LASTEXITCODE -ne 0) { throw "Workspace tests failed" }
          ./windows/scripts/build_windows.ps1 -TestModel "$env:RUNNER_TEMP/whisper/models/ggml-tiny.en.bin" -TestAudio "$env:RUNNER_TEMP/whisper/samples/jfk.wav"
      - uses: actions/upload-artifact@v4
        with:
          name: Ipta-windows
          path: windows/dist/
